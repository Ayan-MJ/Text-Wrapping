[package]
name = "lastdraft-flow"
version = "0.1.0"
edition = "2021"
description = "Deterministic anchored-object text flow for LastDraft"
license = "Proprietary"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
